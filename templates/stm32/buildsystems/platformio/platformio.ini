; {{PROJECT_NAME}} - STM32 (HAL) · PlatformIO 工程
;
; 编译：pio run
; 烧录：pio run -t upload      （需 ST-Link）
; 串口：pio device monitor
;
; ⚠️ 说明：本工程自带完整的 HAL + CMSIS + 链接脚本（和 Makefile / CMake 版本共用同一套源码），
;    因此这里用 framework = cmsis 只取平台提供的 CMSIS 内核头与启动文件，
;    HAL 用工程 Drivers/ 下的那一份，避免与 framework = stm32cube 自带的 HAL 重复定义。

[platformio]
default_envs = bluepill

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = cmsis
upload_protocol = stlink
monitor_speed = 115200

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -Os
    -Wall
    -Wextra
    -ICore/Inc
    -IDrivers/STM32F1xx_HAL_Driver/Inc
    -IDrivers/CMSIS/Device/ST/STM32F1xx/Include
    -IDrivers/CMSIS/Include
    -IDrivers/BSP

; 只编译应用层、BSP 驱动与工程自带的 HAL 源文件。
; 排除 system_stm32f1xx.c：该文件由 framework 提供，重复编译会报符号重定义。
build_src_filter =
    +<../Core/Src/>
    +<../Drivers/BSP/>
    +<../Drivers/STM32F1xx_HAL_Driver/Src/>
    -<../Core/Src/system_stm32f1xx.c>

; 启动文件由 framework 提供（根目录的 startup_stm32f103xb.s 不进 build_src_filter，不会被编译）
